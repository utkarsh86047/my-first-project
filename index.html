<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .emoji {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .message {
            font-size: 20px;
            color: #333;
            font-weight: 600;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn:hover {
            background-color: #ff5252;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .final-style {
            background: #fff0f0;
            border: 2px dashed #ff4757;
        }

        .final-style .message {
            color: #d63031;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="emoji" id="emojiIcon">🎁</div>
        <div class="message" id="msgText">आपके लिए एक सरप्राइज है! नीचे दिए बटन पर क्लिक करें।</div>
        <button class="btn" id="nextBtn" onclick="nextMessage()">Open / Next ➔</button>
    </div>

    <script>
        // क्लिक करने पर आने वाले मैसेजेस की लिस्ट
        const messages = [
            { text: "बस एक और क्लिक... 🤫", emoji: "🤫" },
            { text: "थोड़ा और पेशेंस रखो! 😜", emoji: "😜" },
            { text: "सोच रही होगी कि आगे क्या है? 🤔", emoji: "🤔" },
            { text: "अरे रुकिए, इतना भी क्या जल्दी है! 😂", emoji: "😂" },
            { text: "लास्ट वाला पक्का सरप्राइज है... 🙈", emoji: "🙈" },
            { text: "कितना टाइम वेस्ट करेगी? अब जाकर पढ़ाई कर ले! 📚✍️", emoji: "🛑" }
        ];

        let currentIndex = 0;

        function nextMessage() {
            if (currentIndex < messages.length) {
                // मैसेज और इमोजी अपडेट करें
                document.getElementById("msgText").innerText = messages[currentIndex].text;
                document.getElementById("emojiIcon").innerText = messages[currentIndex].emoji;

                // अगर आख़िरी मैसेज है तो बटन छिपा दें और स्टाइल चेंज करें
                if (currentIndex === messages.length - 1) {
                    document.getElementById("nextBtn").style.display = "none";
                    document.getElementById("mainCard").classList.add("final-style");
                }

                currentIndex++;
            }
        }
    </script>

</body>
</html>
