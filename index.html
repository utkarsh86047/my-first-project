<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Core | Utkarsh Mishra</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #030712;
            color: #00f0ff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 45px 32px;
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
            max-width: 480px;
            width: 90%;
            text-align: center;
            transition: all 0.4s ease;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #00f0ff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #00f0ff;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .emoji-box {
            font-size: 50px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
        }

        .message-box {
            font-size: 17px;
            font-weight: 600;
            min-height: 90px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .btn {
            background: transparent;
            color: #00f0ff;
            border: 2px solid #00f0ff;
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            transition: all 0.3s ease;
            outline: none;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #00f0ff;
            color: #030712;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .developer-credit {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 10;
            font-size: 12px;
            color: #64748b;
            background: rgba(3, 7, 18, 0.8);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .developer-credit span {
            color: #00f0ff;
            font-weight: bold;
        }

        .system-override {
            border-color: #ff0055;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.25);
        }

        .system-override .message-box {
            color: #ff0055;
        }

        .system-override .btn {
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="container" id="mainContainer">
        <div class="terminal-header">
            <span>SECURE_LINK // V.4.0</span>
            <span><span class="status-dot"></span> SYSTEM ACTIVE</span>
        </div>
        <div class="emoji-box" id="emoji">🌐</div>
        <div class="message-box" id="text">INITIALIZING NEURAL PROTOCOL... CLICK TO PROCEED.</div>
        <button class="btn" id="actionBtn" onclick="nextStep()">EXECUTE ➔</button>
    </div>

    <div class="developer-credit">ARCHITECT: <span>UTKARSH MISHRA</span></div>

    <script>
        // --- 1. Cinematic Sci-Fi Audio Engine ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'beep') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } else if (type === 'cinematic_boom') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            }
        }

        // --- 2. Advanced Matrix/Particle Background ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class CyberParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5;
                this.color = Math.random() > 0.3 ? '#00f0ff' : '#bd00ff';
                this.alpha = Math.random() * 0.8 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        for (let i = 0; i < 90; i++) particles.push(new CyberParticle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- 3. Cinematic Sci-Fi Sequence Steps ---
        const steps = [
            { text: "BYPASSING MAINFRAME FIREWALL...", emoji: "⚡" },
            { text: "DECRYPTING CLASSIFIED NEURAL DATA...", emoji: "🔓" },
            { text: "ESTABLISHING SECURE QUANTUM LINK...", emoji: "🛰️" },
            { text: "ACCESS GRANTED. TARGET IDENTIFIED.", emoji: "🎯" },
            { text: "WARNING: SYSTEM OVERLOAD DETECTED. PREPARE FOR IMPACT.", emoji: "⚠️" },
            { text: "CORE BREACH: EXQUISITE TALENT DETECTED BY UTKARSH MISHRA.", emoji: "💎" }
        ];

        let currentStep = 0;

        function typeWriter(text, i) {
            if (i < text.length) {
                document.getElementById("text").innerHTML = text.substring(0, i + 1) + '<span style="color:#00f0ff">_</span>';
                setTimeout(() => typeWriter(text, i + 1), 25);
            }
        }

        function nextStep() {
            if (currentStep < steps.length) {
                playSound('beep');
                const step = steps[currentStep];
                document.getElementById("emoji").innerText = step.emoji;
                typeWriter(step.text, 0);

                if (currentStep === steps.length - 1) {
                    playSound('cinematic_boom');
                    document.getElementById("mainContainer").classList.add("system-override");
                    triggerCinematicPulse();
                }

                currentStep++;
            }
        }

        function triggerCinematicPulse() {
            for (let i = 0; i < 150; i++) {
                let p = new CyberParticle();
                p.size = Math.random() * 4 + 1;
                p.speedX = (Math.random() - 0.5) * 14;
                p.speedY = (Math.random() - 0.5) * 14;
                p.color = '#ff0055';
                particles.push(p);
            }
        }
    </script>
</body>
</html>
