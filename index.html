<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITS All-POT Master Hub | Utkarsh Mishra</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #38bdf8;
            --success-color: #22c55e; --error-color: #ef4444; --text-color: #f8fafc; --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 800px; margin: 0 auto; }
        #lock-screen { background: var(--card-bg); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); margin-top: 50px; }
        input[type="password"] { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; font-size: 16px; }
        button { background: var(--accent-color); color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        #main-hub { display: none; }
        header { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-bottom: 3px solid var(--accent-color); display: flex; justify-content: space-between; align-items: center; }
        .controls { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        select { flex: 1; padding: 10px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid #334155; min-width: 200px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .q-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #0f172a; color: var(--text-color); text-align: left; padding: 12px; border-radius: 6px; border: 1px solid #334155; cursor: pointer; }
        .option-btn.correct { background: var(--success-color) !important; color: #fff !important; }
        .option-btn.incorrect { background: var(--error-color) !important; color: #fff !important; }
        .explanation-box { display: none; margin-top: 15px; padding: 15px; background: rgba(56, 189, 248, 0.1); border-left: 4px solid var(--accent-color); border-radius: 4px; font-size: 14px; }
        .score-card { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 2px solid var(--accent-color); display: none; }
        .score-num { font-size: 32px; font-weight: bold; color: var(--accent-color); margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <div id="lock-screen">
        <h2>CITS POT Master Hub</h2>
        <p style="color: var(--text-sub); margin-top: 5px;">Enter Access Password</p>
        <input type="password" id="pass-input" placeholder="Password daalo">
        <button onclick="unlockApp()">Unlock Access</button>
        <p id="lock-msg" style="color: var(--error-color); margin-top: 10px;"></p>
    </div>
    <div id="main-hub">
        <header>
            <div><h3 style="color: var(--accent-color);">NIMI POT All-In-One Hub</h3><span style="font-size: 12px; color: var(--text-sub);">Developer: Utkarsh Mishra</span></div>
            <button onclick="lockApp()" style="width: auto; padding: 6px 12px; font-size: 12px;">Lock</button>
        </header>
        <div class="controls">
            <select id="module-select" onchange="startSelectedQuiz()">
                <option value="m1">Module 1: Roles & Responsibilities of Instructor (30 MCQs)</option>
                <option value="m2">Module 2: Psychology of Learning (30 MCQs)</option>
                <option value="m3">Module 3: Syllabus Analysis & ADDIE Model (30 MCQs)</option>
                <option value="master">🔥 All-POT Master Test (Randomized)</option>
            </select>
            <button onclick="startSelectedQuiz()" style="width: auto;">Start Test</button>
        </div>
        <div id="score-card" class="score-card"><h3>Test Progress Summary</h3><div id="score-percent" class="score-num">0%</div><p id="score-details"></p></div>
        <div id="quiz-container"></div>
    </div>
</div>
<script>

    m1: [

        { q: "2. CITS (Craft Instructor Training Scheme) ka main aim kya hai?", options: ["A) Instructors ko Pedagogical skills aur training methodology dena", "B) School degree", "C) Direct B.Tech degree", "D) Non-technical diploma"], ans: 0, exp: "CITS instructors ko yeh sikhata hai ki apni trade knowledge ko trainees tak effectively kaise transfer karein." },

        { q: "5. NCVT ka full form kya hai?", options: ["A) National Council for Vocational Training", "B) National Committee for Vocational Teaching", "C) New Center for Vocational Training", "D) National Course for Vocational Trades"], ans: 0, exp: "NCVT vocational training policies aur standards set karne wali apex body hai." },
        { q: "6. NSQF ka full form kya hai?", options: ["A) National Skill Qualifications Framework", "B) National Student Quality Federation", "C) New Skill Quality Foundation", "D) National System for Qualification Framework"], ans: 0, exp: "NSQF competency-based framework hai jo qualifications ko levels mein organize karta hai." },
        { q: "7. NSQF Level 4 kis training program ke barabar hota hai?", options: ["A) CTS (ITI Pass)", "B) CITS Instructor", "C) Diploma", "D) Degree"], ans: 0, exp: "CTS (ITI) level 4 qualification framework ke antargat aata hai." },
        { q: "8. Instructor ke dwara workshop safety rules follow karwana kis domain mein aata hai?", options: ["A) Cognitive", "B) Affective / Behavioral", "C) Psychomotor", "D) Intellectual"], ans: 1, exp: "Safety attitude aur discipline 'Affective Domain' ka hiss hote hain." },
        { q: "9. Vocational instruction mein 4-Step Method ka pehla step kaun sa hai?", options: ["A) Presentation", "B) Preparation", "C) Application", "D) Testing"], ans: 1, exp: "4-Step teaching method ka pehla step 'Preparation' (Introduction/Motivation) hota hai." },
        { q: "10. Trainees ko job ke liye motivate karna instructor ki kis responsibility mein aata hai?", options: ["A) Administrative", "B) Pedagogical & Leadership", "C) Financial", "D) Legal"], ans: 1, exp: "Trainees ka morale aur interest badhana instructor ki leadership responsibility hai." },
        { q: "11. ITI instructor ka primary role kya hai?", options: ["A) Facilitator aur Skill Trainer", "B) Shop Manager", "C) Evaluator only", "D) Paper Setter"], ans: 0, exp: "Instructor ek facilitator hota hai jo practical skills aur theoretical knowledge sikhata hai." },
        { q: "12. Instructor ko workshop management mein sabse pehle kiska dhyan rakhna chahiye?", options: ["A) Safety aur 5S system", "B) Raw material wastage", "C) Fast output only", "D) Attendance sheet"], ans: 0, exp: "Safety First aur 5S system workshop efficiency ke liye sabse pehla rule hai." },
        { q: "13. NCVET ka full form kya hai?", options: ["A) National Council for Vocational Education and Training", "B) National Center for Vocational Entrance Test", "C) National Council for Voluntary Educational Training", "D) New Center for Vocational Excellence Training"], ans: 0, exp: "NCVET vocational training ka umbrella regulator hai." },
        { q: "14. Instructor ke liye 'Code of Ethics' ka kya matlab hai?", options: ["A) Professional rules aur moral values follow karna", "B) Dress code only", "C) Time table follow karna only", "D) Exam conduct karna"], ans: 0, exp: "Code of Ethics professional integrity aur moral conduct ko define karta hai." },
        { q: "15. Trainees ke individual differences ko samajhna kyun zaroori hai?", options: ["A) Flexible teaching approach apnane ke liye", "B) Slow learners ko remove karne ke liye", "C) Grouping band karne ke liye", "D) Marks kam dene ke liye"], ans: 0, exp: "Har trainee ki learning speed alag hoti hai, isliye individual attention zaroori hai." },
        { q: "16. Dual System of Training (DST) mein training kahan hoti hai?", options: ["A) ITI aur Industry dono mein", "B) Sirf ITI mein", "C) Sirf Online", "D) Sirf College mein"], ans: 0, exp: "DST mein theoretical background ITI mein aur practical industrial exposure industry mein milta hai." },
        { q: "17. Training record maintain karne ke liye instructor dwara kaun sa register use hota hai?", options: ["A) Progress Chart aur Attendance Register", "B) Stock Register only", "C) Cash Book", "D) Visitor Register"], ans: 0, exp: "Progress chart har trainee ki practical skill development ka record rakhta hai." },
        { q: "18. Instructor ka communicative clarity kyun zaroori hai?", options: ["A) Effective information delivery ke liye", "B) Loud voice dikhane ke liye", "C) Accent dikhane ke liye", "D) Time pass ke liye"], ans: 0, exp: "Spasht boli aur clear language se trainees instruction ko bina ambiguity ke samajhte hain." },

        { q: "21. Apprenticeship Training Scheme (ATS) kis act ke tehat chalti hai?", options: ["A) Apprentices Act 1961", "B) Factories Act 1948", "C) Industrial Dispute Act 1947", "D) Skill Act 2015"], ans: 0, exp: "ATS Apprentices Act 1961 ke antargat governed hoti hai." },

        { q: "26. CBT ka full form vocational assessment mein kya hai?", options: ["A) Computer Based Test", "B) Course Based Training", "C) Center Based Teaching", "D) Craft Based Training"], ans: 0, exp: "CBT ka matlab Computer Based Test hota hai." },
        { q: "27. Instructor ke liye continuous self-development kyun zaroori hai?", options: ["A) Industry technologies ke sath updated rehne ke liye", "B) Salary hike only", "C) Transfer ke liye", "D) Routine duty ke liye"], ans: 0, exp: "New tools, automation aur pedagogy updates ke sath instructor ko hamesha updated rehna chahiye." },
        { q: "28. Trainee ke performance drop hone par instructor ko sabse pehle kya karna chahiye?", options: ["A) Cause analyze karna aur counseling karna", "B) Immediately suspend karna", "C) Exam se rokna", "D) Ignore karna"], ans: 0, exp: "Performance drop ke piche ka reason analyze karke guide karna chahiye." },
        { q: "29. Practical workshop session mein safety instruction kab deni chahiye?", options: ["A) Job shuru hone se pehle (Preparation stage mein)", "B) Job khatam hone ke baad", "C) Accident hone ke baad", "D) Exam time par"], ans: 0, exp: "Safety briefing hamesha demo aur job shuru hone se pehle di jati hai." },
        { q: "30. Formative Assessment ka main outcome kya hota hai?", options: ["A) Continuous learning improvement aur feedback", "B) Final degree award", "C) Annual ranking", "D) Pass/Fail certificate"], ans: 0, exp: "Formative assessment training ke dauran continuous feedback aur improvement ke liye hota hai." }
    ],
    m2: [
        { q: "1. Thorndike ke 'Law of Effect' ke mutabiq learning par kya prabhav padta hai?", options: ["A) Satisfying result milne par learning strong hoti hai", "B) Punishment se speed badhti hai", "C) Practice zaroori nahi hai", "D) Memory weak hoti hai"], ans: 0, exp: "Satisfying response S-R connection ko strengthen karta hai." },
        { q: "2. Thorndike ka 'Law of Exercise' kis par sabse zyada zor deta hai?", options: ["A) Physical fitness", "B) Abhyas aur Repetition (Practice)", "C) Time management", "D) Strict punishment"], ans: 1, exp: "Law of Exercise kehta hai ki abhyas se S-R bond strong hota hai." },
        { q: "3. Thorndike ka 'Law of Readiness' kya batata hai?", options: ["A) Learner jab mentally/physically taiyar ho tabhi sikh sakta hai", "B) Fast running", "C) Early arrival", "D) Exam readiness"], ans: 0, exp: "Readiness ka matlab hai ki learner learning state mein hone par hi effectively sikh pata hai." },
        { q: "4. Cognitive Learning Domain kis se sambandhit hai?", options: ["A) Brain aur Intellectual Skills", "B) Physical movement", "C) Emotions aur Feelings", "D) Muscle strength"], ans: 0, exp: "Cognitive domain Dimaag, Thinking, Knowledge aur Problem Solving se judi hoti hai." },
        { q: "5. Psychomotor Domain kis cheez par focus karta hai?", options: ["A) Manual & Physical Skills (Hands-on work)", "B) Memory recall", "C) Attitudes", "D) Emotional stability"], ans: 0, exp: "Vocational trades mein practical tools ka use Psychomotor Domain mein aata hai." },
        { q: "6. Affective Domain ka main relate kis se hai?", options: ["A) Emotions, Attitudes aur Values", "B) Calculation", "C) Lathe Operation", "D) Writing speed"], ans: 0, exp: "Affective domain insaan ke bhavnao, attitude aur ethical values ko cover karta hai." },
        { q: "7. Pavlov ke 'Classical Conditioning' experiment mein kis animal par study hui thi?", options: ["A) Dog", "B) Rat", "C) Cat", "D) Pigeon"], ans: 0, exp: "Ivan Pavlov ne dog aur bell ke saath conditioning experiment kiya tha." },
        { q: "8. B.F. Skinner ne kis learning theory ka vikas kiya tha?", options: ["A) Operant Conditioning", "B) Classical Conditioning", "C) Insight Learning", "D) Social Learning"], ans: 0, exp: "Skinner ne Operant Conditioning (Reinforcement Theory) di thi." },
        { q: "9. Positive Reinforcement ka learning par kya effect hota hai?", options: ["A) Desirable behavior repeat hone ki probability badhti hai", "B) Behavior stop ho jata hai", "C) Fear paida hota hai", "D) Memory loss hota hai"], ans: 0, exp: "Reward ya praise se desired action bar-bar dohrane ka incentive milta hai." },
        { q: "10. Memory ke 3 main stages ka sahi kram kya hai?", options: ["A) Encoding -> Storage -> Retrieval", "B) Storage -> Encoding -> Retrieval", "C) Retrieval -> Storage -> Encoding", "D) Encoding -> Retrieval -> Storage"], ans: 0, exp: "Pehle brain information encode karta hai, fir store karta hai, aur zaroorat padne par retrieve karta hai." },
        { q: "11. 'Forgetting Curve' ka concept kis psychologist ne diya tha?", options: ["A) Hermann Ebbinghaus", "B) Bloom", "C) Thorndike", "D) Pavlov"], ans: 0, exp: "Ebbinghaus ne bataya tha ki samay ke sath bina revision ke information fast fade hoti hai." },
        { q: "12. Maslow's Hierarchy of Needs mein sabse basic/lower level need kaun si hai?", options: ["A) Physiological Needs (Roti, kapda, makan, rest)", "B) Safety Needs", "C) Self-Actualization", "D) Social Needs"], ans: 0, exp: "Insaan ki sabse buniyadi zarurat Physiological needs hoti hai." },
        { q: "13. Maslow's Pyramid ka sabse highest level kaun sa hai?", options: ["A) Self-Actualization", "B) Esteem Needs", "C) Safety Needs", "D) Social Needs"], ans: 0, exp: "Self-Actualization ka matlab apne highest potential ko achieve karna hota hai." },
        { q: "14. Motivation do tarah ki hoti hai: Intrinsic aur Extrinsic. Intrinsic motivation ka udaharan kya hai?", options: ["A) Inner satisfaction aur interest se sikhna", "B) Prize ke liye sikhna", "C) Punishment ke darr se sikhna", "D) Marks ke liye sikhna"], ans: 0, exp: "Intrinsic motivation andar ki ichha aur aatmasantushti se aati hai." },
        { q: "15. Extrinsic Motivation ka udaharan kya hai?", options: ["A) Reward, Cash prize ya Certificate paane ke liye kaam karna", "B) Personal joy", "C) Internal satisfaction", "D) Curiosity"], ans: 0, exp: "Extrinsic motivation bahari incentives par nirbhar karti hai." },
        { q: "16. Transfer of Training ka kya matlab hai?", options: ["A) Ek situation mein sikhi skill ko doosri situation mein apply karna", "B) College transfer hona", "C) Job switch karna", "D) Notes copy karna"], ans: 0, exp: "Sikhe hue gyan ko nayi condition mein upyog karna Transfer of Learning hai." },
        { q: "17. Negative Transfer of Training kab hota hai?", options: ["A) Jab purani habit nayi learning mein rukavat bane", "B) Jab learning fast ho jaye", "C) Jab zero effect ho", "D) Jab full marks aayein"], ans: 0, exp: "Jaise Right-hand drive car chalane wale ko Left-hand drive car chalane mein dikkat aana." },

let userScore = 0; let totalAttempted = 0; let currentQuestions = [];
function unlockApp() {
    const val = document.getElementById('pass-input').value.trim();
    if (val === "UTKARSH@2559") {
        sessionStorage.setItem("pot_auth", "true");
        document.getElementById('lock-screen').style.display = "none";
        document.getElementById('main-hub').style.display = "block";
        startSelectedQuiz();
    } else { document.getElementById('lock-msg').innerText = "Incorrect Password!"; }
}
function lockApp() { sessionStorage.removeItem("pot_auth"); location.reload(); }
if (sessionStorage.getItem("pot_auth") === "true") {
    document.getElementById('lock-screen').style.display = "none";
    document.getElementById('main-hub').style.display = "block";
    window.onload = startSelectedQuiz;
}
function startSelectedQuiz() {
    const mod = document.getElementById('module-select').value;
    const container = document.getElementById('quiz-container');
    const scoreCard = document.getElementById('score-card');
    userScore = 0; totalAttempted = 0; scoreCard.style.display = "block"; updateScoreUI(0, 0); container.innerHTML = "";
    if (mod === "master") {
        currentQuestions = []; Object.keys(potDatabase).forEach(k => currentQuestions.push(...potDatabase[k]));
        currentQuestions = currentQuestions.sort(() => Math.random() - 0.5);
    } else { currentQuestions = [...(potDatabase[mod] || [])]; }
    if (currentQuestions.length === 0) { container.innerHTML = "<p style='text-align:center; padding: 20px;'>Is Module ke questions update ho rahe hain...</p>"; return; }
    currentQuestions.forEach((qData, qIdx) => {
        const card = document.createElement('div'); card.className = "card";
        let optsHTML = ""; qData.options.forEach((opt, oIdx) => { optsHTML += `<button class="option-btn" onclick="checkAns(this, ${qIdx}, ${oIdx}, ${qData.ans})">${opt}</button>`; });
        card.innerHTML = `<div class="q-title">${qData.q}</div><div class="options-grid" id="opt-group-${qIdx}">${optsHTML}</div><div class="explanation-box" id="exp-${qIdx}"><strong>📌 NIMI Concept:</strong> ${qData.exp}</div>`;
        container.appendChild(card);
    });
}
function checkAns(btn, qIdx, selectedOpt, correctOpt) {
    const parent = document.getElementById(`opt-group-${qIdx}`);
    const buttons = parent.getElementsByClassName('option-btn');
    const expBox = document.getElementById(`exp-${qIdx}`);
    for (let b of buttons) { b.disabled = true; }
    totalAttempted++;
    if (selectedOpt === correctOpt) { btn.classList.add('correct'); userScore++; }
    else { btn.classList.add('incorrect'); buttons[correctOpt].classList.add('correct'); }
    expBox.style.display = "block"; updateScoreUI(userScore, currentQuestions.length);
}
function updateScoreUI(score, total) {
    const percent = total > 0 ? Math.round((score / total) * 100) : 0;
    document.getElementById('score-percent').innerText = `${percent}%`;
    document.getElementById('score-details').innerText = `Correct: ${score} / ${total} Questions`;
}
</script>
