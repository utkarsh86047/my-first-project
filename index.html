<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specially For My Favorite Chasmish</title>
    <style>
        body {
            background-color: #0a0a0c;
            color: #e2e8f0;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .specs-glow {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 15%;
            z-index: 1;
            animation: floatGlow 5s ease-in-out infinite;
        }
        @keyframes floatGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .card {
            background: #111115;
            border: 2px solid #9333ea;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            max-width: 440px;
            width: 90%;
            z-index: 2;
        }
        h1 {
            color: #a855f7;
            margin-bottom: 5px;
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(147, 51, 234, 0.4);
        }
        .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .content-box {
            background: #070709;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #d1d5db;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.6;
        }
        /* ज़बरदस्त नाचने वाला डांसिंग इमोजी एनीमेशन */
        .dancing-emoji {
            display: none;
            font-size: 5rem;
            animation: dance 0.5s linear infinite alternate;
            margin-top: 10px;
        }
        @keyframes dance {
            0% { transform: rotate(-20deg) translateY(0px); }
            100% { transform: rotate(20deg) translateY(-15px); }
        }
        button {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.4);
            transition: all 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(147, 51, 234, 0.6);
        }
    </style>
</head>
<body>
    <div class="specs-glow"></div>
    <div class="card">
        <h1>CHASMISH DETECTOR 👓</h1>
        <div class="subtitle">A customized vision test script for my favorite 4-eyes.</div>
        <div class="content-box">
            <div id="statusText">"Please clean your 4K HD glasses before tapping the button, or you might completely miss the test."</div>
            <div id="emojiClip" class="dancing-emoji">🕺✨😎</div>
        </div>
        <button id="actionBtn" onclick="activatePrank()">Start HD Vision Test</button>
    </div>

    <script>
        function activatePrank() {
            document.getElementById('statusText').innerHTML = "<span style='color:#a855f7; font-size:1.4rem;'>YOU GOT RICKROLLED!</span><br><span style='color:#6b7280; font-size:1rem;'>Never gonna give you up~</span>";
            document.getElementById('emojiClip').style.display = 'block';
            document.getElementById('actionBtn').innerText = "Trolled Successfully! 🎯";
            document.getElementById('actionBtn').style.background = "#238636";
            document.getElementById('actionBtn').disabled = true;
        }
    </script>
</body>
</html>
