<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITS All-POT Master Hub | Utkarsh Mishra</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #38bdf8;
            --success-color: #22c55e; --error-color: #ef4444; --text-color: #f8fafc; --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 800px; margin: 0 auto; }
        
        #lock-screen { background: var(--card-bg); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); margin-top: 50px; }
        input[type="password"] { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; font-size: 16px; }
        button { background: var(--accent-color); color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        #main-hub { display: none; }
        header { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-bottom: 3px solid var(--accent-color); display: flex; justify-content: space-between; align-items: center; }
        .controls { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        select { flex: 1; padding: 10px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid #334155; min-width: 200px; }
        
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .q-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; line-height: 1.4; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #0f172a; color: var(--text-color); text-align: left; padding: 14px; border-radius: 8px; border: 1px solid #334155; cursor: pointer; font-size: 15px; width: 100%; }
        .option-btn.correct { background: var(--success-color) !important; color: #fff !important; }
        .option-btn.incorrect { background: var(--error-color) !important; color: #fff !important; }
        
        .explanation-box { display: none; margin-top: 15px; padding: 15px; background: rgba(56, 189, 248, 0.1); border-left: 4px solid var(--accent-color); border-radius: 4px; font-size: 14px; line-height: 1.5; }
        
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .q-counter { text-align: center; font-size: 14px; color: var(--accent-color); font-weight: bold; margin-bottom: 10px; }

        .score-card { background: var(--card-bg); padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 2px solid var(--accent-color); display: none; }
        .score-num { font-size: 48px; font-weight: bold; color: var(--accent-color); margin: 15px 0; }
        
        /* Special Thanks Banner */
        .thanks-banner {
            margin-top: 20px; padding: 15px; background: rgba(34, 197, 94, 0.1);
            border: 1px dashed var(--success-color); border-radius: 8px; font-size: 15px; color: #22c55e; font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Lock Screen -->
    <div id="lock-screen">
        <h2>CITS POT Master Hub</h2>
        <p style="color: var(--text-sub); margin-top: 5px;">Enter Access Password</p>
        <input type="password" id="pass-input" placeholder="Password daalo">
        <button onclick="unlockApp()" style="width: 100%;">Unlock Access</button>
        <p id="lock-msg" style="color: var(--error-color); margin-top: 10px;"></p>
    </div>

    <!-- Main Hub UI -->
    <div id="main-hub">
        <header>
            <div><h3 style="color: var(--accent-color);">NIMI POT All-In-One Hub</h3><span style="font-size: 12px; color: var(--text-sub);">Developer: Utkarsh Mishra</span></div>
            <button onclick="lockApp()" style="padding: 6px 12px; font-size: 12px;">Lock</button>
        </header>
        
        <div class="controls">
            <select id="module-select" onchange="startSelectedQuiz()">
                <option value="m1">Module 1: Roles & Responsibilities of Instructor (NIMI Standard)</option>
                <option value="m2">Module 2: Psychology of Learning & Laws (NIMI Standard)</option>
                <option value="m3">Module 3: Syllabus Analysis & ADDIE Model (NIMI Standard)</option>
                <option value="master">🔥 All-POT Master Test (Randomized)</option>
            </select>
            <button onclick="startSelectedQuiz()">Start Test</button>
        </div>

        <!-- CBT Quiz Box -->
        <div id="quiz-wrapper">
            <div id="q-counter" class="q-counter"></div>
            <div id="quiz-container"></div>
            <div class="nav-buttons" id="nav-buttons" style="display:none;">
                <button id="prev-btn" onclick="prevQuestion()" disabled>← Previous</button>
                <button id="next-btn" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <!-- Score Card Banner -->
        <div id="score-card" class="score-card">
            <h3>🎉 Test Completed!</h3>
            <div id="score-percent" class="score-num">0%</div>
            <p id="score-details" style="font-size: 18px;"></p>
            
            <div class="thanks-banner">
                🙏 Special thanks to <strong>Utkarsh Mishra</strong> for creating and sharing this amazing hub!
            </div>

            <button onclick="startSelectedQuiz()" style="margin-top: 20px;">Re-Take Test</button>
        </div>
    </div>
</div>

<script>
// Authentic NIMI CITS / Bharat Skills Level Question Database
const potDatabase = {
    m1: [
        { q: "1. Craftsmen Training Scheme (CTS) ko kis mukhya uddeshya ke sath shuru kiya gaya tha?", options: ["Industrial sectors ke liye skilled manpower/craftsmen ki demand ko poora karna", "Academic research aur higher degree dena", "Sirf administrative clerical jobs ke liye training dena", "Purely theoretical school education provide karna"], ansText: "Industrial sectors ke liye skilled manpower/craftsmen ki demand ko poora karna", exp: "NIMI standards ke anusar CTS ka primary focus industrial growth ke mutabiq technical/practical skilled workers tayar karna hai." },
        { q: "2. Craft Instructor Training Scheme (CITS) ka sabse mukhya aur pramukh lakshya kya hota hai?", options: ["ITI trainees ko effectively padhane ke liye instructors ko Pedagogy aur teaching methodology mein train karna", "Industrial factory workers ki salary fix karna", "Engineering colleges ke liye professors tayar karna", "Non-technical office management sikhana"], ansText: "ITI trainees ko effectively padhane ke liye instructors ko Pedagogy aur teaching methodology mein train karna", exp: "CITS ka mukhya uddeshya technical instructors ko teaching skills aur effective knowledge transfer methods se equip karna hai." },
        { q: "3. Directorate General of Training (DGT) kis central ministry ke administrative control ke antargat aati hai?", options: ["Ministry of Skill Development and Entrepreneurship (MSDE)", "Ministry of Education", "Ministry of Labour and Employment", "Ministry of Heavy Industries"], ansText: "Ministry of Skill Development and Entrepreneurship (MSDE)", exp: "DGT pehle Ministry of Labour ke under thi, ab yeh MSDE ke antargat desh ki vocational training policies govern karti hai." },
        { q: "4. Ek aadarsh (ideal) instructor ke vyaktitv mein kaun sa mukhya gun hone se training sabse prabhavi banti hai?", options: ["Subject expertise ke sath-sath patience, empathy aur strong communication skills", "Trainees par strict discipline rakhne ke liye darr ka mahol banana", "Sirf theoretical books read karke chale jana", "Practical work se door rehkar sirf lectures dena"], ansText: "Subject expertise ke sath-sath patience, empathy aur strong communication skills", exp: "Acche instructor ko subject ki deep knowledge hone ke saath-saath trainees ki mental state ko samajhne ki empathy honi chahiye." },
        { q: "5. National Council for Vocational Training (NCVT) ka mukhya karya kya hai?", options: ["Vocational training ke national standards, curricula aur certification ke liye norms set karna", "Industrial raw material ki prices decide karna", "ITI buildings ka construction karna", "Private engineering colleges ko funding dena"], ansText: "Vocational training ke national standards, curricula aur certification ke liye norms set karna", exp: "NCVT ek apex advisory body hai jo country-wide vocational training aur national trade certificates (NTC/NAC) ko standardize karti hai." },
        { q: "6. National Skill Qualifications Framework (NSQF) kis prakar ka framework hai?", options: ["Competency-based framework jo sabhi qualifications ko levels mein organize karta hai", "Sirf school students ke liye ek scholarship scheme", "Industrial taxation ka naya niyam", "Government employees ki promotion policy"], ansText: "Competency-based framework jo sabhi qualifications ko levels mein organize karta hai", exp: "NSQF ek nationally integrated education and competency-based framework hai jo learning outcomes ko levels 1 se 10 mein define karta hai." },
        { q: "7. National Council for Vocational Education and Training (NCVET) ko kis roop mein sthapit kiya gaya hai?", options: ["Vocational education aur training ke liye ek regulator (umbrella body)", "Sirf exam form bharne ki agency", "Ek manufacturing company", "ITI sports club"], ansText: "Vocational education aur training ke liye ek regulator (umbrella body)", exp: "NCVET ko awarding bodies, assessment agencies aur skill institutes ko regulate karne ke liye banaya gaya hai." },
        { q: "8. Workshop ke andar safety rules ka sakhti se palan karwana instructor ki kis category ki responsibility mein aata hai?", options: ["Safety aur Moral/Professional responsibility", "Sirf financial accounting", "Building maintenance work", "Canteen management"], ansText: "Safety aur Moral/Professional responsibility", exp: "Trainees ki physical safety aur safe workshop practices ensure karna instructor ki top-most ethical duty hai." },
        { q: "9. Dual System of Training (DST) ki mukhya visheshzta kya hai?", options: ["Training ka theoretical hissa ITI mein aur practical industrial exposure industry mein dena", "Sirf online classes chalana", "Training keval summer vacation mein dena", "Ghar baithe degree lena"], ansText: "Training ka theoretical hissa ITI mein aur practical industrial exposure industry mein dena", exp: "DST model German dual education system par adharit hai jisme ITI aur industry milkar training dete hain." },
        { q: "10. Trainees ki practical progress aur skill development ko track karne ke liye instructor dwara sabse mukhya document kaun sa maintain kiya jata hai?", options: ["Progress Chart (Training Progress Card)", "Visitor Entry Register", "Electricity Bill Log", "Stock Purchase Ledger"], ansText: "Progress Chart (Training Progress Card)", exp: "Progress chart har trainee ke trade operations aur jobs ki completion status ka real-time graphical record hota hai." },
        { q: "11. 'Code of Ethics' ek instructor ke liye kyun avashyak hai?", options: ["Professional integrity, fairness aur high moral conduct maintain karne ke liye", "Sirf uniform pehnane ke liye", "Late aane par fine bachane ke liye", "Office politics ke liye"], ansText: "Professional integrity, fairness aur high moral conduct maintain karne ke liye", exp: "Code of Ethics instructor ko students ke prati fair, honest aur professional rehne ki guidance deta hai." },
        { q: "12. Trainees ke individual differences (vyaktigat bhinnata) ko dhyan mein rakhte hue instructor ko kya apnana chahiye?", options: ["Flexible teaching strategies aur remedial attention", "Sabhi students ko ek hi speed se padhana chahe samajh aaye ya nahi", "Slow learners ko class se nikal dena", "Sirf toppers par dhyan dena"], ansText: "Flexible teaching strategies aur remedial attention", exp: "Har trainee ki grasping power alag hoti hai, isliye individual differences ko respect dena zaroori hai." },
        { q: "13. Apprenticeship Training Scheme (ATS) kis statutory act ke antargat regulated hoti hai?", options: ["Apprentices Act 1961", "Factories Act 1948", "Industrial Disputes Act 1947", "Consumer Protection Act 2019"], ansText: "Apprentices Act 1961", exp: "Apprenticeship training pure desh mein Apprentices Act 1961 (amended time to time) ke tehat chalti hai." },
        { q: "14. Workshop management mein '5S' system ka pehla step 'Seiri' (Sort) ka kya arth hai?", options: ["Zaroori aur gair-zaroori (unnecessary) items ko alag karke unnecessary ko hatana", "Sabhi tools ko zameen par fekh dena", "Workshop ki rang-pootai karna", "Roz subah attendance lena"], ansText: "Zaroori aur gair-zaroori (unnecessary) items ko alag karke unnecessary ko hatana", exp: "Seiri (Sort) ka matlab workspace se un sabhi cheezon ko hata dena hai jo current task ke liye zaroori nahi hain." },
        { q: "15. Micro-teaching session mein instructor/trainee teacher ko kiska immediate feedback milta hai?", options: ["Peer trainees aur supervisor ka teaching performance par", "Government audit officer ka tax report par", "Factory manager ka production output par", "Market customer ka feedback"], ansText: "Peer trainees aur supervisor ka teaching performance par", exp: "Micro-teaching ek controlled teaching practice hai jisme peers turant specific teaching skills par feedback dete hain." },
        { q: "16. Vocational training mein 'Empathy' (sahanubhuti/samvedansheelta) ka kya mahatva hai?", options: ["Trainee ki learning difficulty ko uske nazariye se samajhna", "Trainees ke sath emotional rona-dhona karna", "Har galti ko bina soche maaf kar dena", "Strict punishment dena"], ansText: "Trainee ki learning difficulty ko uske nazariye se samajhna", exp: "Empathy ka matlab student ki mental struggle ko samajhkar uske level par jakar help karna hai." },
        { q: "17. On-the-Job Training (OJT) ka sabse bada labh trainee ko kya milta hai?", options: ["Real industrial environment, modern machinery aur live production pressure ka anubhav", "Classroom mein baith kar notes likhna", "Sirf exam ki tayari karna", "Library books padhna"], ansText: "Real industrial environment, modern machinery aur live production pressure ka anubhav", exp: "OJT trainees ko industry ki actual working conditions se rubaroo karwata hai." },
        { q: "18. Instructor ki 'Communicative Clarity' ka teaching par kya prabhav padta hai?", options: ["Trainees instructions ko bina kisi confusion ke turant samajh kar execute karte hain", "Class mein shor sharaba badhta hai", "Trainees confuse ho jate hain", "Lecture lamba ho jata hai"], ansText: "Trainees instructions ko bina kisi confusion ke turant samajh kar execute karte hain", exp: "Spasht aur clear communication technical instructions aur safety rules ke liye sabse anivarya hai." },
        { q: "19. Formative Assessment ka mukhya uddeshya training ke dauran kya hota hai?", options: ["Continuous feedback dena aur learning gaps ko turant sudharna", "Course ke ant mein final pass/fail certificate dena", "Student ki caste check karna", "Fees collect karna"], ansText: "Continuous feedback dena aur learning gaps ko turant sudharna", exp: "Formative assessment formative stage par learning ko monitor karne aur improve karne ke liye hota hai." },
        { q: "20. Instructor ko apni technical aur pedagogical knowledge ko update rakhne ke liye kya karna chahiye?", options: ["Continuous Professional Development (CPD) aur refresher/training programs attend karna", "Purane notes ko 20 saal tak repeat karna", "Nayi technology se door rehna", "Sirf practical workshop band rakhna"], ansText: "Continuous Professional Development (CPD) aur refresher/training programs attend karna", exp: "Modern industry aur automation ke daur mein instructor ke liye continuous learning anivarya hai." },
        { q: "21. Skill Competitions (jaise IndiaSkills ya WorldSkills) ka main objective kya hota hai?", options: ["Trainees mein vocational excellence, speed aur perfection ki bhavna ko badhava dena", "Sirf entertainment karna", "Government funds spend karna", "Training ko lambha khinchna"], ansText: "Trainees mein vocational excellence, speed aur perfection ki bhavna ko badhava dena", exp: "Ye competitions global standards ke mutabiq best craftsmanship ko samne late hain." },
        { q: "22. Workshop mein safety briefing job shuru karne se PEHLE kyun di jati hai?", options: ["Trainees ko potential hazards aur safe operational procedures pehle se pata hon", "Time pass karne ke liye", "Attendance poori karne ke liye", "Bad mein punishment dene ke liye"], ansText: "Trainees ko potential hazards aur safe operational procedures pehle se pata hon", exp: "Prevention is better than cure; safety instructions pehle dene se accidents roke jate hain." },
        { q: "23. NSQF ke antargat ITI (CTS) passout ko kis level ki qualification milti hai?", options: ["Level 3 / Level 4", "Level 10", "Level 1", "Level 8"], ansText: "Level 3 / Level 4", exp: "Standard ITI certificate NSQF level 3 ya 4 ke equivalent designate kiya jata hai." },
        { q: "24. Trainee ke sudden behavioral change ya performance drop par instructor ka sabse pehla step kya hona chahiye?", options: ["Private mein friendly counseling karke root cause pata lagana", "Turant class se suspend kar dena", "Sabke samne insult karna", "Ignore karke aage badhna"], ansText: "Private mein friendly counseling karke root cause pata lagana", exp: "Instructor ek mentor bhi hota hai, isliye behavioral issues ko empathetic counseling se handle karna chahiye." },
        { q: "25. Instructor ka 'Leadership Role' workshop mein kaisa hona chahiye?", options: ["Democratic aur supportive (jo trainees ko guide aur inspire kare)", "Dictator jaisa (sirf hukam chalane wala)", "Bilkul inactive", "Sirf punishment dene wala"], ansText: "Democratic aur supportive (jo trainees ko guide aur inspire kare)", exp: "Democratic leadership se trainees mein confidence aur team spirit develop hoti hai." },
        { q: "26. Institutional Training aur Industrial Training ka mukhya samanjasya (bridge) kaun banata hai?", options: ["Vocational Instructor aur Training Coordinator", "College warden", "Canteen contractor", "Security guard"], ansText: "Vocational Instructor aur Training Coordinator", exp: "Instructor hi wo main kadi hai jo institute ke gyan ko industry ki zaruron se jodta hai." },
        { q: "27. Training records mein 'Attendance Register' ka hona kis baat ko ensure karta hai?", options: ["Statutory compliance aur trainee ki regular presence ka legal record", "Sirf punishment ke liye", "Time pass ke liye", "Notes likhne ke liye"], ansText: "Statutory compliance aur trainee ki regular presence ka legal record", exp: "Legal aur certification eligibility ke liye minimum attendance mandatory hoti hai." },
        { q: "28. 'Learning Culture' ek ITI workshop mein kaisa hona chahiye?", options: ["Safe, cooperative, inquisitive aur hands-on working environment", "Dar aur shor sharabe wala mahol", "Sirf ratta marne wala room", "Bilkul sunsaan"], ansText: "Safe, cooperative, inquisitive aur hands-on working environment", exp: "Ek healthy learning culture mein sawal puchne ki aur experiment karne ki azadi hoti hai." },
        { q: "29. DGT ke dwara naye courses aur trades ko launch karne ka main aadhar kya hota hai?", options: ["Market survey aur emerging industrial technologies (Industry 4.0)", "Instructor ki marzi", "Purani books ki availability", "Building ki jagah"], ansText: "Market survey aur emerging industrial technologies (Industry 4.0)", exp: "Curriculum hamesha job market ki modern demand ke anusar evolve kiya jata hai." },
        { q: "30. Ek aadarsh instructor ka ultimate goal kya hona chahiye?", options: ["Aise competent, confident aur safe-conscious skilled technicians banana jo desh ke vikas mein yogdan dein", "Sirf exam mein 100% pass percentage dikhana", "Government salary time par lena", "Workshop mein kam se kam kaam karna"], ansText: "Aise competent, confident aur safe-conscious skilled technicians banana jo desh ke vikas mein yogdan dein", exp: "Instructor ka mukhya lakshya desh ke liye industry-ready skilled workforce tayar karna hai." }
    ],
    m2: [
        { q: "1. Thorndike ke 'Law of Effect' (prabhav ka niyam) ka learning par sabse bada prabhav kya hai?", options: ["Jab kisi learning action ka result satisfying/rewarding hota hai, toh wo behavior strong ho jata hai", "Punaravriti (practice) se hi sab kuch hota hai", "Darr se learning fast hoti hai", "Learning ka result se koi lena-dena nahi hai"], ansText: "Jab kisi learning action ka result satisfying/rewarding hota hai, toh wo behavior strong ho jata hai", exp: "Law of Effect kehta hai ki positive consequences learning connection (S-R bond) ko mazboot banate hain." },
        { q: "2. Thorndike ka 'Law of Exercise' (abhyas ka niyam) kis mukhya siddhant par zor deta hai?", options: ["Law of Use and Disuse (jitna abhyas karoge, skill utni pakki hogi)", "Sirf ek baar padhne par permanent yaad hona", "Bina practice ke master ban jana", "Sirf sone se memory badhna"], ansText: "Law of Use and Disuse (jitna abhyas karoge, skill utni pakki hogi)", exp: "Law of Exercise batata hai ki repetition aur practice se neural connection strong hote hain." },
        { q: "3. Thorndike ka 'Law of Readiness' (tatparta ka niyam) teaching-learning mein kya darshata hai?", options: ["Jab learner mentally aur physically sikhne ke liye taiyar ho, tab sikhana sabse aasan aur prabhavi hota hai", "Exam hall mein time par pahunchna", "Tool box ready rakhna", "Morning assembly attend karna"], ansText: "Jab learner mentally aur physically sikhne ke liye taiyar ho, tab sikhana sabse aasan aur prabhavi hota hai", exp: "Readiness ka matlab learner ki mental/physical preparedness hai; bina readiness ke force karne par frustration hoti hai." },
        { q: "4. Bloom's Taxonomy ke anusaar 'Cognitive Domain' ka sambandh kisse hai?", options: ["Mental skills, knowledge, intellect aur problem-solving abilities se", "Hath ki physical safai se", "Bhavnaon aur attitude se", "Muscle strength se"], ansText: "Mental skills, knowledge, intellect aur problem-solving abilities se", exp: "Cognitive domain dimaag se judi thinking, remembering, analyzing aur evaluating activities ko cover karti hai." },
        { q: "5. 'Psychomotor Domain' vocational training trades (jaise fitter, electrician) mein kyun sabse mahatvapurna hai?", options: ["Kyunki iska sambandh physical movement, manual dexterity aur hands-on tool manipulation se hai", "Kyunki isse sirf theory likhi jati hai", "Kyunki isse dimaag tez hota hai", "Kyunki isse geet sangeet sikhaya jata hai"], ansText: "Kyunki iska sambandh physical movement, manual dexterity aur hands-on tool manipulation se hai", exp: "Psychomotor domain coordination aur physical skill execution (jaise filing, wiring) se related hai." },
        { q: "6. 'Affective Domain' ka mukhya kshetra kya hai?", options: ["Values, attitudes, emotions, appreciation aur professional ethics", "Mathematical calculation speed", "Machine RPM measurement", "Typing speed"], ansText: "Values, attitudes, emotions, appreciation aur professional ethics", exp: "Affective domain trainee ke behavior, safety attitude aur discipline ko shape karti hai." },
        { q: "7. Ivan Pavlov ke 'Classical Conditioning' experiment mein unhone kis par prayog kiya tha?", options: ["Dog (kutte) ki salivation response par", "Chimpanzee ki intelligence par", "Raton ki maze learning par", "Pigeon ki flight par"], ansText: "Dog (kutte) ki salivation response par", exp: "Pavlov ne unconditioned stimulus (food) aur conditioned stimulus (bell) ke beech pairing karke conditioning sikhai thi." },
        { q: "8. B.F. Skinner dwara di gayi 'Operant Conditioning' theory ka mukhya aadhar kya hai?", options: ["Reinforcement (reward ya punishment) ke dwara behavior ko shape karna", "Bina kisi reward ke sikhana", "Achanak sochna (Insight)", "Sirf dekh kar nakal karna"], ansText: "Reinforcement (reward ya punishment) ke dwara behavior ko shape karna", exp: "Skinner box experiment mein rats ne reward/consequence ke adhar par actions repeat karna sikha." },
        { q: "9. Positive Reinforcement (sakaratmak punarbal) ka training par kya asar hota hai?", options: ["Desired behavior (sahi kaam) ko dobara karne ki probability badh jati hai", "Trainee class chor kar bhag jata hai", "Memory weak ho jati hai", "Koi asar nahi hota"], ansText: "Desired behavior (sahi kaam) ko dobara karne ki probability badh jati hai", exp: "Praise, appreciation ya reward se trainee wahi achhi habit repeat karne ke liye motivated hota hai." },
        { q: "10. Human Memory ke 3 mukhya stages ka sahi kram kaun sa hai?", options: ["Encoding -> Storage -> Retrieval", "Storage -> Retrieval -> Encoding", "Retrieval -> Encoding -> Storage", "Encoding -> Retrieval -> Storage"], ansText: "Encoding -> Storage -> Retrieval", exp: "Pehle brain data ko encode karta hai, fir memory store karta hai, aur zaroorat par retrieve karta hai." },
        { q: "11. Hermann Ebbinghaus ka 'Forgetting Curve' kya darshata hai?", options: ["Ki samay beetne ke sath bina revision ke memory fast fade (kam) hoti hai", "Ki memory kabhi kam nahi hoti", "Ki ratta marne se permanent yaad hota hai", "Ki sote waqt sab yaad ho jata hai"], ansText: "Ki samay beetne ke sath bina revision ke memory fast fade (kam) hoti hai", exp: "Ebbinghaus curve batata hai ki shuru ke ghanto mein forgetting rate sabse fast hoti hai, jiske liye spaced repetition zaroori hai." },

let currentQuestions = [];
let currentIndex = 0;
let userAnswers = {};

function unlockApp() {
    const val = document.getElementById('pass-input').value.trim();
    if (val === "UTKARSH@2559") {
        sessionStorage.setItem("pot_auth", "true");
        document.getElementById('lock-screen').style.display = "none";
        document.getElementById('main-hub').style.display = "block";
        startSelectedQuiz();
    } else { 
        document.getElementById('lock-msg').innerText = "Incorrect Password!"; 
    }
}

function lockApp() { sessionStorage.removeItem("pot_auth"); location.reload(); }

if (sessionStorage.getItem("pot_auth") === "true") {
    document.getElementById('lock-screen').style.display = "none";
    document.getElementById('main-hub').style.display = "block";
    window.onload = startSelectedQuiz;
}

function startSelectedQuiz() {
    const mod = document.getElementById('module-select').value;
    document.getElementById('score-card').style.display = "none";
    document.getElementById('quiz-wrapper').style.display = "block";
    
    currentIndex = 0;
    userAnswers = {};

    let rawQuestions = [];
    if (mod === "master") {
        Object.keys(potDatabase).forEach(k => rawQuestions.push(...potDatabase[k]));
        rawQuestions = rawQuestions.sort(() => Math.random() - 0.5);
    } else { 
        rawQuestions = JSON.parse(JSON.stringify(potDatabase[mod] || [])); 
    }

    // Shuffle options dynamically for each question
    currentQuestions = rawQuestions.map(q => {
        let shuffledOpts = [...q.options].sort(() => Math.random() - 0.5);
        return {
            q: q.q,
            options: shuffledOpts,
            ansText: q.ansText,
            exp: q.exp
        };
    });

    if (currentQuestions.length === 0) { 
        document.getElementById('quiz-container').innerHTML = "<p style='text-align:center; padding: 20px;'>Is Module ke questions update ho rahe hain...</p>"; 
        document.getElementById('nav-buttons').style.display = "none";
        document.getElementById('q-counter').innerText = "";
        return; 
    }

    document.getElementById('nav-buttons').style.display = "flex";
    renderQuestion();
}

function renderQuestion() {
    const container = document.getElementById('quiz-container');
    const qData = currentQuestions[currentIndex];
    const prefixes = ["A) ", "B) ", "C) ", "D) "];
    
    document.getElementById('q-counter').innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
    
    let optsHTML = "";
    qData.options.forEach((optText, oIdx) => {
        let extraClass = "";
        let isSelected = userAnswers[currentIndex] !== undefined;
        
        if (isSelected) {
            if (optText === qData.ansText) extraClass = "correct";
            else if (userAnswers[currentIndex] === optText) extraClass = "incorrect";
        }

        optsHTML += `<button class="option-btn ${extraClass}" ${isSelected ? 'disabled' : ''} onclick="selectAnswer('${optText.replace(/'/g, "\\'")}')">${prefixes[oIdx]}${optText}</button>`;
    });

    const isAnswered = userAnswers[currentIndex] !== undefined;

    container.innerHTML = `
        <div class="card">
            <div class="q-title">${qData.q}</div>
            <div class="options-grid">${optsHTML}</div>
            <div class="explanation-box" id="exp-box" style="display: ${isAnswered ? 'block' : 'none'};">
                <strong>📌 NIMI Concept:</strong> ${qData.exp}
            </div>
        </div>
    `;

    document.getElementById('prev-btn').disabled = currentIndex === 0;
    const nextBtn = document.getElementById('next-btn');
    if (currentIndex === currentQuestions.length - 1) {
        nextBtn.innerText = "Finish & Submit";
    } else {
        nextBtn.innerText = "Next →";
    }
}

function selectAnswer(selectedOptText) {
    if (userAnswers[currentIndex] !== undefined) return;
    
    userAnswers[currentIndex] = selectedOptText;
    renderQuestion();
}

function nextQuestion() {
    if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        finishQuiz();
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function finishQuiz() {
    document.getElementById('quiz-wrapper').style.display = "none";
    const scoreCard = document.getElementById('score-card');
    
    let correctCount = 0;
    currentQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === q.ansText) {
            correctCount++;
        }
    });

    const total = currentQuestions.length;
    const percent = total > 0 ? Math.round((correctCount / total) * 100) : 0;

    document.getElementById('score-percent').innerText = `${percent}%`;
    document.getElementById('score-details').innerText = `Aapne ${total} mein se ${correctCount} questions sahi kiye!`;
    scoreCard.style.display = "block";
}
