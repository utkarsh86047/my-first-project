<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Thank You</title>
    <style>
        body {
            background-color: #06090e;
            color: #f0f6fc;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* जादुई नाचते हुए कंफ़ेटी (Confetti Background) */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff7b72;
            border-radius: 50%;
            animation: fall infinite linear;
            z-index: 1;
            opacity: 0.7;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .card {
            background: rgba(13, 17, 23, 0.85);
            border: 2px solid #58a6ff;
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            max-width: 420px;
            width: 90%;
            backdrop-filter: blur(10px);
            z-index: 2;
            animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-image: linear-gradient(45deg, #58a6ff, #ff7b72, #79c0ff) 1;
        }

        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* चमकता हुआ धड़कता दिल (Glowing Heart) */
        .heart-icon {
            font-size: 4.5rem;
            display: inline-block;
            animation: heartbeat 1.2s infinite ease-in-out alternate;
            text-shadow: 0 0 20px rgba(255, 123, 114, 0.6);
            margin-bottom: 15px;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        h1 {
            color: #58a6ff;
            font-size: 2.6rem;
            margin: 10px 0;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #58a6ff, #79c0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message {
            color: #8b949e;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-top: 15px;
            font-weight: 500;
        }

        .signature {
            color: #58a6ff;
            font-size: 0.95rem;
            margin-top: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: bold;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- JavaScript dynamic confetti particles -->
    <script>
        const colors = ['#58a6ff', '#ff7b72', '#79c0ff', '#ff9e3b', '#56d364'];
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = (Math.random() * 2) + 's';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.width = confetti.style.height = (Math.random() * 6 + 6) + 'px';
            document.body.appendChild(confetti);
        }
    </script>

    <div class="card">
        <div class="heart-icon">💝</div>
        <h1>THANK YOU!</h1>
        <div class="message">
            ". Thank you sagun for helping drawing in my e.d.."
        </div>
        <div class="signature">✨ Crafted With Code ✨</div>
    </div>
</body>
</html>
