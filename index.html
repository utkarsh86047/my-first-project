<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>The 1% League Dashboard</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        p {
            color: #8b949e;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .status-badge {
            background-color: #238636;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>THE 1% LEAGUE</h1>
        <p>I will focus will my own criteria of power in own status.</p>
        <div class="status-badge">Status: Silent Operator Mode [ON]</div>
    </div>
</body>
</html>
