<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITS All-POT Master Hub | Utkarsh Mishra</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #38bdf8;
            --success-color: #22c55e; --error-color: #ef4444; --text-color: #f8fafc; --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 800px; margin: 0 auto; }
        
        #lock-screen { background: var(--card-bg); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); margin-top: 50px; }
        input[type="password"] { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; text-align: center; font-size: 16px; }
        button { background: var(--accent-color); color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        #main-hub { display: none; }
        header { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border-bottom: 3px solid var(--accent-color); display: flex; justify-content: space-between; align-items: center; }
        .controls { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        select { flex: 1; padding: 10px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid #334155; min-width: 200px; }
        
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .q-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; line-height: 1.4; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #0f172a; color: var(--text-color); text-align: left; padding: 14px; border-radius: 8px; border: 1px solid #334155; cursor: pointer; font-size: 15px; width: 100%; }
        .option-btn.correct { background: var(--success-color) !important; color: #fff !important; }
        .option-btn.incorrect { background: var(--error-color) !important; color: #fff !important; }
        
        .explanation-box { display: none; margin-top: 15px; padding: 15px; background: rgba(56, 189, 248, 0.1); border-left: 4px solid var(--accent-color); border-radius: 4px; font-size: 14px; }
        
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .q-counter { text-align: center; font-size: 14px; color: var(--accent-color); font-weight: bold; margin-bottom: 10px; }

        .score-card { background: var(--card-bg); padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 2px solid var(--accent-color); display: none; }
        .score-num { font-size: 48px; font-weight: bold; color: var(--accent-color); margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <!-- Lock Screen -->
    <div id="lock-screen">
        <h2>CITS POT Master Hub</h2>
        <p style="color: var(--text-sub); margin-top: 5px;">Enter Access Password</p>
        <input type="password" id="pass-input" placeholder="Password daalo">
        <button onclick="unlockApp()" style="width: 100%;">Unlock Access</button>
        <p id="lock-msg" style="color: var(--error-color); margin-top: 10px;"></p>
    </div>

    <!-- Main Hub UI -->
    <div id="main-hub">
        <header>
            <div><h3 style="color: var(--accent-color);">NIMI POT All-In-One Hub</h3><span style="font-size: 12px; color: var(--text-sub);">Developer: Utkarsh Mishra</span></div>
            <button onclick="lockApp()" style="padding: 6px 12px; font-size: 12px;">Lock</button>
        </header>
        
        <div class="controls">
            <select id="module-select" onchange="startSelectedQuiz()">
                <option value="m1">Module 1: Roles & Responsibilities of Instructor (30 MCQs)</option>
                <option value="m2">Module 2: Psychology of Learning (30 MCQs)</option>
                <option value="m3">Module 3: Syllabus Analysis & ADDIE Model (30 MCQs)</option>
                <option value="master">🔥 All-POT Master Test (Randomized)</option>
            </select>
            <button onclick="startSelectedQuiz()">Start Test</button>
        </div>

        <!-- CBT Quiz Box -->
        <div id="quiz-wrapper">
            <div id="q-counter" class="q-counter"></div>
            <div id="quiz-container"></div>
            <div class="nav-buttons" id="nav-buttons" style="display:none;">
                <button id="prev-btn" onclick="prevQuestion()" disabled>← Previous</button>
                <button id="next-btn" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <!-- Score Card Banner -->
        <div id="score-card" class="score-card">
            <h3>🎉 Test Completed!</h3>
            <div id="score-percent" class="score-num">0%</div>
            <p id="score-details" style="font-size: 18px;"></p>
            <button onclick="startSelectedQuiz()" style="margin-top: 20px;">Re-Take Test</button>
        </div>
    </div>
</div>

<script>
const potDatabase = {
    m1: [
        { q: "1. Craftsmen Training Scheme (CTS) ka main objective kya hai?", options: ["Skilled workforce (kaarigar) taiyar karna", "Academic research", "Sirf theory sikhana", "Office admin job"], ansText: "Skilled workforce (kaarigar) taiyar karna", exp: "CTS ka mukhya uddeshya industry ke liye skilled craftsmen ko practical level par taiyar karna hai." },
        { q: "2. CITS (Craft Instructor Training Scheme) ka main aim kya hai?", options: ["Instructors ko Pedagogical skills aur training methodology dena", "School degree", "Direct B.Tech degree", "Non-technical diploma"], ansText: "Instructors ko Pedagogical skills aur training methodology dena", exp: "CITS instructors ko yeh sikhata hai ki apni trade knowledge ko trainees tak effectively kaise transfer karein." },
        { q: "3. DGT ka full form kya hai?", options: ["Directorate General of Training", "Department of General Teaching", "Direct Government Training", "Division of Group Training"], ansText: "Directorate General of Training", exp: "DGT Ministry of Skill Development and Entrepreneurship ke andar aati hai." },
        { q: "4. Ek acche instructor ki sabse mukhya personality characteristic kya honi chahiye?", options: ["Patience, empathy aur subject expertise", "Strict punishment dena", "Trainees se baat na karna", "Fast lecture dena"], ansText: "Patience, empathy aur subject expertise", exp: "Instructor mein dhairya, sahanubhuti aur subject ka pura gyan hona sabse zaroori hai." },
        { q: "5. NCVT ka full form kya hai?", options: ["National Council for Vocational Training", "National Committee for Vocational Teaching", "New Center for Vocational Training", "National Course for Vocational Trades"], ansText: "National Council for Vocational Training", exp: "NCVT vocational training policies aur standards set karne wali apex body hai." },
        { q: "6. NSQF ka full form kya hai?", options: ["National Skill Qualifications Framework", "National Student Quality Federation", "New Skill Quality Foundation", "National System for Qualification Framework"], ansText: "National Skill Qualifications Framework", exp: "NSQF competency-based framework hai jo qualifications ko levels mein organize karta hai." },
        { q: "7. NSQF Level 4 kis training program ke barabar hota hai?", options: ["CTS (ITI Pass)", "CITS Instructor", "Diploma", "Degree"], ansText: "CTS (ITI Pass)", exp: "CTS (ITI) level 4 qualification framework ke antargat aata hai." },
        { q: "8. Instructor ke dwara workshop safety rules follow karwana kis domain mein aata hai?", options: ["Affective / Behavioral", "Cognitive", "Psychomotor", "Intellectual"], ansText: "Affective / Behavioral", exp: "Safety attitude aur discipline 'Affective Domain' ka hiss hote hain." },
        { q: "9. Vocational instruction mein 4-Step Method ka pehla step kaun sa hai?", options: ["Preparation", "Presentation", "Application", "Testing"], ansText: "Preparation", exp: "4-Step teaching method ka pehla step 'Preparation' (Introduction/Motivation) hota hai." },
        { q: "10. Trainees ko job ke liye motivate karna instructor ki kis responsibility mein aata hai?", options: ["Pedagogical & Leadership", "Administrative", "Financial", "Legal"], ansText: "Pedagogical & Leadership", exp: "Trainees ka morale aur interest badhana instructor ki leadership responsibility hai." },
        { q: "11. ITI instructor ka primary role kya hai?", options: ["Facilitator aur Skill Trainer", "Shop Manager", "Evaluator only", "Paper Setter"], ansText: "Facilitator aur Skill Trainer", exp: "Instructor ek facilitator hota hai jo practical skills aur theoretical knowledge sikhata hai." },
        { q: "12. Instructor ko workshop management mein sabse pehle kiska dhyan rakhna chahiye?", options: ["Safety aur 5S system", "Raw material wastage", "Fast output only", "Attendance sheet"], ansText: "Safety aur 5S system", exp: "Safety First aur 5S system workshop efficiency ke liye sabse pehla rule hai." },
        { q: "13. NCVET ka full form kya hai?", options: ["National Council for Vocational Education and Training", "National Center for Vocational Entrance Test", "National Council for Voluntary Educational Training", "New Center for Vocational Excellence Training"], ansText: "National Council for Vocational Education and Training", exp: "NCVET vocational training ka umbrella regulator hai." },
        { q: "14. Instructor ke liye 'Code of Ethics' ka kya matlab hai?", options: ["Professional rules aur moral values follow karna", "Dress code only", "Time table follow karna only", "Exam conduct karna"], ansText: "Professional rules aur moral values follow karna", exp: "Code of Ethics professional integrity aur moral conduct ko define karta hai." },
        { q: "15. Trainees ke individual differences ko samajhna kyun zaroori hai?", options: ["Flexible teaching approach apnane ke liye", "Slow learners ko remove karne ke liye", "Grouping band karne ke liye", "Marks kam dene ke liye"], ansText: "Flexible teaching approach apnane ke liye", exp: "Har trainee ki learning speed alag hoti hai, isliye individual attention zaroori hai." },
        { q: "16. Dual System of Training (DST) mein training kahan hoti hai?", options: ["ITI aur Industry dono mein", "Sirf ITI mein", "Sirf Online", "Sirf College mein"], ansText: "ITI aur Industry dono mein", exp: "DST mein theoretical background ITI mein aur practical industrial exposure industry mein milta hai." },
        { q: "17. Training record maintain karne ke liye instructor dwara kaun sa register use hota hai?", options: ["Progress Chart aur Attendance Register", "Stock Register only", "Cash Book", "Visitor Register"], ansText: "Progress Chart aur Attendance Register", exp: "Progress chart har trainee ki practical skill development ka record rakhta hai." },
        { q: "18. Instructor ka communicative clarity kyun zaroori hai?", options: ["Effective information delivery ke liye", "Loud voice dikhane ke liye", "Accent dikhane ke liye", "Time pass ke liye"], ansText: "Effective information delivery ke liye", exp: "Spasht boli aur clear language se trainees instruction ko bina ambiguity ke samajhte hain." },
        { q: "19. On-the-Job Training (OJT) ka mukhya labh kya hai?", options: ["Real industrial environment mein learning", "Classroom sitting", "Paper reading", "Exam exemption"], ansText: "Real industrial environment mein learning", exp: "OJT se trainees real-world machinery aur production stress mein kaam karna sikhte hain." },
        { q: "20. Micro-teaching session mein feedback kaun deta hai?", options: ["Peer trainees aur Supervisor", "Principal only", "Outside Industry manager", "Student parents"], ansText: "Peer trainees aur Supervisor", exp: "Micro-teaching mein peers aur guide immediately feedback dete hain." },
        { q: "21. Apprenticeship Training Scheme (ATS) kis act ke tehat chalti hai?", options: ["Apprentices Act 1961", "Factories Act 1948", "Industrial Dispute Act 1947", "Skill Act 2015"], ansText: "Apprentices Act 1961", exp: "ATS Apprentices Act 1961 ke antargat governed hoti hai." },
        { q: "22. Skill competition ka mukhya purpose kya hota hai?", options: ["Excellence aur healthy competition ko encourage karna", "Commercial sales", "Failure candidates ka elimination", "Degree distribution"], ansText: "Excellence aur healthy competition ko encourage karna", exp: "WorldSkills aur National Skill competitions trainees mein perfection aur motivation laate hain." },
        { q: "23. Workshop environment mein 5S ka 'Seiri' (Sort) kya darshata hai?", options: ["Unnecessary items ko hatana", "Safai karna", "Standardize karna", "Order mein rakhna"], ansText: "Unnecessary items ko hatana", exp: "Seiri ka matlab zaroori aur gair-zaroori saman ko alag karke gair-zaroori ko hatana hai." },
        { q: "24. Housekeeping ka 5S system kis country se originated hai?", options: ["Japan", "USA", "Germany", "India"], ansText: "Japan", exp: "5S methodology Japan se shuru hui thi." },
        { q: "25. Instructor ka 'Empathy' attribute kya darshata hai?", options: ["Trainee ki jagah rakh kar uski problem samajhna", "Sympathy dikhana", "Strict decision lena", "Negligence"], ansText: "Trainee ki jagah rakh kar uski problem samajhna", exp: "Empathy ka matlab trainee ki jagah par hokar uski learning difficulty ko samajhna hai." },
        { q: "26. CBT ka full form vocational assessment mein kya hai?", options: ["Computer Based Test", "Course Based Training", "Center Based Teaching", "Craft Based Training"], ansText: "Computer Based Test", exp: "CBT ka matlab Computer Based Test hota hai." },
        { q: "27. Instructor ke liye continuous self-development kyun zaroori hai?", options: ["Industry technologies ke sath updated rehne ke liye", "Salary hike only", "Transfer ke liye", "Routine duty ke liye"], ansText: "Industry technologies ke sath updated rehne ke liye", exp: "New tools, automation aur pedagogy updates ke sath instructor ko hamesha updated rehna chahiye." },
        { q: "28. Trainee ke performance drop hone par instructor ko sabse pehle kya karna chahiye?", options: ["Cause analyze karna aur counseling karna", "Immediately suspend karna", "Exam se rokna", "Ignore karna"], ansText: "Cause analyze karna aur counseling karna", exp: "Performance drop ke piche ka reason analyze karke guide karna chahiye." },
        { q: "29. Practical workshop session mein safety instruction kab deni chahiye?", options: ["Job shuru hone se pehle (Preparation stage mein)", "Job khatam hone ke baad", "Accident hone ke baad", "Exam time par"], ansText: "Job shuru hone se pehle (Preparation stage mein)", exp: "Safety briefing hamesha demo aur job shuru hone se pehle di jati hai." },
        { q: "30. Formative Assessment ka main outcome kya hota hai?", options: ["Continuous learning improvement aur feedback", "Final degree award", "Annual ranking", "Pass/Fail certificate"], ansText: "Continuous learning improvement aur feedback", exp: "Formative assessment training ke dauran continuous feedback aur improvement ke liye hota hai." }
    ],
    m2: [
        { q: "1. Thorndike ke 'Law of Effect' ke mutabiq learning par kya prabhav padta hai?", options: ["Satisfying result milne par learning strong hoti hai", "Punishment se speed badhti hai", "Practice zaroori nahi hai", "Memory weak hoti hai"], ansText: "Satisfying result milne par learning strong hoti hai", exp: "Satisfying response S-R connection ko strengthen karta hai." },
        { q: "2. Thorndike ka 'Law of Exercise' kis par sabse zyada zor deta hai?", options: ["Abhyas aur Repetition (Practice)", "Physical fitness", "Time management", "Strict punishment"], ansText: "Abhyas aur Repetition (Practice)", exp: "Law of Exercise kehta hai ki abhyas se S-R bond strong hota hai." },
        { q: "3. Thorndike ka 'Law of Readiness' kya batata hai?", options: ["Learner jab mentally/physically taiyar ho tabhi sikh sakta hai", "Fast running", "Early arrival", "Exam readiness"], ansText: "Learner jab mentally/physically taiyar ho tabhi sikh sakta hai", exp: "Readiness ka matlab hai ki learner learning state mein hone par hi effectively sikh pata hai." },
        { q: "4. Cognitive Learning Domain kis se sambandhit hai?", options: ["Brain aur Intellectual Skills", "Physical movement", "Emotions aur Feelings", "Muscle strength"], ansText: "Brain aur Intellectual Skills", exp: "Cognitive domain Dimaag, Thinking, Knowledge aur Problem Solving se judi hoti hai." },
        { q: "5. Psychomotor Domain kis cheez par focus karta hai?", options: ["Manual & Physical Skills (Hands-on work)", "Memory recall", "Attitudes", "Emotional stability"], ansText: "Manual & Physical Skills (Hands-on work)", exp: "Vocational trades mein practical tools ka use Psychomotor Domain mein aata hai." },
        { q: "6. Affective Domain ka main relate kis se hai?", options: ["Emotions, Attitudes aur Values", "Calculation", "Lathe Operation", "Writing speed"], ansText: "Emotions, Attitudes aur Values", exp: "Affective domain insaan ke bhavnao, attitude aur ethical values ko cover karta hai." },
        { q: "7. Pavlov ke 'Classical Conditioning' experiment mein kis animal par study hui thi?", options: ["Dog", "Rat", "Cat", "Pigeon"], ansText: "Dog", exp: "Ivan Pavlov ne dog aur bell ke saath conditioning experiment kiya tha." },
        { q: "8. B.F. Skinner ne kis learning theory ka vikas kiya tha?", options: ["Operant Conditioning", "Classical Conditioning", "Insight Learning", "Social Learning"], ansText: "Operant Conditioning", exp: "Skinner ne Operant Conditioning (Reinforcement Theory) di thi." },
        { q: "9. Positive Reinforcement ka learning par kya effect hota hai?", options: ["Desirable behavior repeat hone ki probability badhti hai", "Behavior stop ho jata hai", "Fear paida hota hai", "Memory loss hota hai"], ansText: "Desirable behavior repeat hone ki probability badhti hai", exp: "Reward ya praise se desired action bar-bar dohrane ka incentive milta hai." },
        { q: "10. Memory ke 3 main stages ka sahi kram kya hai?", options: ["Encoding -> Storage -> Retrieval", "Storage -> Encoding -> Retrieval", "Retrieval -> Storage -> Encoding", "Encoding -> Retrieval -> Storage"], ansText: "Encoding -> Storage -> Retrieval", exp: "Pehle brain information encode karta hai, fir store karta hai, aur zaroorat padne par retrieve karta hai." },
        { q: "11. 'Forgetting Curve' ka concept kis psychologist ne diya tha?", options: ["Hermann Ebbinghaus", "Bloom", "Thorndike", "Pavlov"], ansText: "Hermann Ebbinghaus", exp: "Ebbinghaus ne bataya tha ki samay ke sath bina revision ke information fast fade hoti hai." },
        { q: "12. Maslow's Hierarchy of Needs mein sabse basic/lower level need kaun si hai?", options: ["Physiological Needs (Roti, kapda, makan, rest)", "Safety Needs", "Self-Actualization", "Social Needs"], ansText: "Physiological Needs (Roti, kapda, makan, rest)", exp: "Insaan ki sabse buniyadi zarurat Physiological needs hoti hai." },
        { q: "13. Maslow's Pyramid ka sabse highest level kaun sa hai?", options: ["Self-Actualization", "Esteem Needs", "Safety Needs", "Social Needs"], ansText: "Self-Actualization", exp: "Self-Actualization ka matlab apne highest potential ko achieve karna hota hai." },
        { q: "14. Motivation do tarah ki hoti hai: Intrinsic aur Extrinsic. Intrinsic motivation ka udaharan kya hai?", options: ["Inner satisfaction aur interest se sikhna", "Prize ke liye sikhna", "Punishment ke darr se sikhna", "Marks ke liye sikhna"], ansText: "Inner satisfaction aur interest se sikhna", exp: "Intrinsic motivation andar ki ichha aur aatmasantushti se aati hai." },
        { q: "15. Extrinsic Motivation ka udaharan kya hai?", options: ["Reward, Cash prize ya Certificate paane ke liye kaam karna", "Personal joy", "Internal satisfaction", "Curiosity"], ansText: "Reward, Cash prize ya Certificate paane ke liye kaam karna", exp: "Extrinsic motivation bahari incentives par nirbhar karti hai." },
        { q: "16. Transfer of Training ka kya matlab hai?", options: ["Ek situation mein sikhi skill ko doosri situation mein apply karna", "College transfer hona", "Job switch karna", "Notes copy karna"], ansText: "Ek situation mein sikhi skill ko doosri situation mein apply karna", exp: "Sikhe hue gyan ko nayi condition mein upyog karna Transfer of Learning hai." },
        { q: "17. Negative Transfer of Training kab hota hai?", options: ["Jab purani habit nayi learning mein rukavat bane", "Jab learning fast ho jaye", "Jab zero effect ho", "Jab full marks aayein"], ansText: "Jab purani habit nayi learning mein rukavat bane", exp: "Jaise Right-hand drive car chalane wale ko Left-hand drive car chalane mein dikkat aana." },
        { q: "18. Adult Learning Principles ko kya kaha jata hai?", options: ["Andragogy", "Pedagogy", "Psychology", "Demography"], ansText: "Andragogy", exp: "Adults ko sikhane ke vigyan ko Andragogy kehte hain (Knowles dwara given)." },
        { q: "19. Pedagogy aur Andragogy mein mukhya antar kya hai?", options: ["Pedagogy child-centered hoti hai, Andragogy adult/self-directed hoti hai", "Pedagogy adult ke liye hai", "Dono same hain", "Dono non-technical hain"], ansText: "Pedagogy child-centered hoti hai, Andragogy adult/self-directed hoti hai", exp: "Pedagogy mein teacher centered approach hota hai jabki Andragogy self-directed hoti hai." },
        { q: "20. Sensory Memory ka duration kitna hota hai?", options: ["Less than 1-2 seconds", "24 hours", "1 week", "Permanent"], ansText: "Less than 1-2 seconds", exp: "Sensory memory seconds ke fraction ke liye sensation retain karti hai." },
        { q: "21. Short-Term Memory (STM) ki capacity kitni hoti hai?", options: ["7 ± 2 items (Miller's Magic Number)", "Unlimited", "100 items", "Only 1 item"], ansText: "7 ± 2 items (Miller's Magic Number)", exp: "Miller ke anusar human brain ek baar mein STM mein 5-9 chunks store karta hai." },
        { q: "22. Stimulus-Response (S-R) Bond ki strength badhane ke liye kya zaroori hai?", options: ["Practice aur Immediate Feedback", "Long gap", "Delay in test", "No practice"], ansText: "Practice aur Immediate Feedback", exp: "Immediate feedback aur repetition se S-R connection strong hota hai." },
        { q: "23. Gestalt Theory ka main emphasis kis par hai?", options: ["Learning as a Whole (Whole is greater than sum of parts)", "Rote learning", "Step by step memorization", "Trial and error only"], ansText: "Learning as a Whole (Whole is greater than sum of parts)", exp: "Gestalt theory 'Perception of Whole' aur Insight learning par focus karti hai." },
        { q: "24. Kohler ke Chimpanzee experiment se kaun sa learning concept aaya?", options: ["Insight Learning (Aha! Moment)", "Conditioning", "Rote Learning", "Rhythmic learning"], ansText: "Insight Learning (Aha! Moment)", exp: "Sultan naam ke chimpanzee ne problem ko suddenly 'Insight' se solve kiya tha." },
        { q: "25. Learning curve mein 'Plateau' ka kya matlab hota hai?", options: ["Aisa period jahan learning progress stop/flat lagti hai", "Rapid improvement", "Exam failure", "Memory peak"], ansText: "Aisa period jahan learning progress stop/flat lagti hai", exp: "Learning plateau temporary stagnation phase hota hai." },
        { q: "26. Individual Differences ke mukhya karak kya hain?", options: ["Heredity aur Environment", "Clothes aur Style", "Weather only", "School distance"], ansText: "Heredity aur Environment", exp: "Aanuvanshikta (Heredity) aur Vatavaran (Environment) individual differences banate hain." },
        { q: "27. Attention span badhane ke liye instructor ko kya karna chahiye?", options: ["Teaching aids aur active interaction use karna", "Continuous 3-hour lecture dena", "Dark room mein padhana", "Silent reading bolna"], ansText: "Teaching aids aur active interaction use karna", exp: "Media variation aur interaction se trainees ka attention sustain rehta hai." },
        { q: "28. Habit Formation mein sabse pehla step kya hota hai?", options: ["Cue / Trigger", "Reward", "Routine", "Punishment"], ansText: "Cue / Trigger", exp: "Habit loop: Cue -> Routine -> Reward se banti hai." },
        { q: "29. Skill Learning kis domain ke antargat aati hai?", options: ["Psychomotor Domain", "Affective Domain", "Cognitive Domain", "Social Domain"], ansText: "Psychomotor Domain", exp: "Hands-on muscular control psychomotor domain hota hai." },
        { q: "30. Bloom's Taxonomy ke Cognitive Domain ke 6 levels mein sabse basic level kaun sa hai?", options: ["Remembering / Knowledge", "Understanding", "Application", "Analysis"], ansText: "Remembering / Knowledge", exp: "Knowledge/Remembering cognitive pyramid ka foundation level hai." }
    ],
    m3: [
        { q: "1. ADDIE Model mein 'A' ka kya matlab hota hai?", options: ["Analysis", "Application", "Assessment", "Alignment"], ansText: "Analysis", exp: "ADDIE ka matlab Analysis, Design, Development, Implementation, Evaluation hai." },
        { q: "2. ADDIE Model mein 'D' do baar aata hai. Unka sahi sequence kya hai?", options: ["Design, then Development", "Development, then Design", "Evaluation, then Design", "Data, then Design"], ansText: "Design, then Development", exp: "Pehle instruction ko Design kiya jata hai, fir instructional material Develop kiya jata hai." },

let currentQuestions = [];
let currentIndex = 0;
let userAnswers = {};

function unlockApp() {
    const val = document.getElementById('pass-input').value.trim();
    if (val === "UTKARSH@2559") {
        sessionStorage.setItem("pot_auth", "true");
        document.getElementById('lock-screen').style.display = "none";
        document.getElementById('main-hub').style.display = "block";
        startSelectedQuiz();
    } else { 
        document.getElementById('lock-msg').innerText = "Incorrect Password!"; 
    }
}

function lockApp() { sessionStorage.removeItem("pot_auth"); location.reload(); }

if (sessionStorage.getItem("pot_auth") === "true") {
    document.getElementById('lock-screen').style.display = "none";
    document.getElementById('main-hub').style.display = "block";
    window.onload = startSelectedQuiz;
}

function startSelectedQuiz() {
    const mod = document.getElementById('module-select').value;
    document.getElementById('score-card').style.display = "none";
    document.getElementById('quiz-wrapper').style.display = "block";
    
    currentIndex = 0;
    userAnswers = {};

    let rawQuestions = [];
    if (mod === "master") {
        Object.keys(potDatabase).forEach(k => rawQuestions.push(...potDatabase[k]));
        rawQuestions = rawQuestions.sort(() => Math.random() - 0.5);
    } else { 
        rawQuestions = JSON.parse(JSON.stringify(potDatabase[mod] || [])); 
    }

    // Shuffle options dynamically for each question
    currentQuestions = rawQuestions.map(q => {
        let shuffledOpts = [...q.options].sort(() => Math.random() - 0.5);
        return {
            q: q.q,
            options: shuffledOpts,
            ansText: q.ansText,
            exp: q.exp
        };
    });

    if (currentQuestions.length === 0) { 
        document.getElementById('quiz-container').innerHTML = "<p style='text-align:center; padding: 20px;'>Is Module ke questions update ho rahe hain...</p>"; 
        document.getElementById('nav-buttons').style.display = "none";
        document.getElementById('q-counter').innerText = "";
        return; 
    }

    document.getElementById('nav-buttons').style.display = "flex";
    renderQuestion();
}

function renderQuestion() {
    const container = document.getElementById('quiz-container');
    const qData = currentQuestions[currentIndex];
    const prefixes = ["A) ", "B) ", "C) ", "D) "];
    
    document.getElementById('q-counter').innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
    
    let optsHTML = "";
    qData.options.forEach((optText, oIdx) => {
        let extraClass = "";
        let isSelected = userAnswers[currentIndex] !== undefined;
        
        if (isSelected) {
            if (optText === qData.ansText) extraClass = "correct";
            else if (userAnswers[currentIndex] === optText) extraClass = "incorrect";
        }

        optsHTML += `<button class="option-btn ${extraClass}" ${isSelected ? 'disabled' : ''} onclick="selectAnswer('${optText.replace(/'/g, "\\'")}')">${prefixes[oIdx]}${optText}</button>`;
    });

    const isAnswered = userAnswers[currentIndex] !== undefined;

    container.innerHTML = `
        <div class="card">
            <div class="q-title">${qData.q}</div>
            <div class="options-grid">${optsHTML}</div>
            <div class="explanation-box" id="exp-box" style="display: ${isAnswered ? 'block' : 'none'};">
                <strong>📌 NIMI Concept:</strong> ${qData.exp}
            </div>
        </div>
    `;

    document.getElementById('prev-btn').disabled = currentIndex === 0;
    const nextBtn = document.getElementById('next-btn');
    if (currentIndex === currentQuestions.length - 1) {
        nextBtn.innerText = "Finish & Submit";
    } else {
        nextBtn.innerText = "Next →";
    }
}

function selectAnswer(selectedOptText) {
    if (userAnswers[currentIndex] !== undefined) return;
    
    userAnswers[currentIndex] = selectedOptText;
    renderQuestion();
}

function nextQuestion() {
    if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
    } else {
        finishQuiz();
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
    }
}

function finishQuiz() {
    document.getElementById('quiz-wrapper').style.display = "none";
    const scoreCard = document.getElementById('score-card');
    
    let correctCount = 0;
    currentQuestions.forEach((q, idx) => {
        if (userAnswers[idx] === q.ansText) {
            correctCount++;
        }
    });

    const total = currentQuestions.length;
    const percent = total > 0 ? Math.round((correctCount / total) * 100) : 0;

    document.getElementById('score-percent').innerText = `${percent}%`;
    document.getElementById('score-details').innerText = `Aapne ${total} mein se ${correctCount} questions sahi kiye!`;
    scoreCard.style.display = "block";
}
</script>
